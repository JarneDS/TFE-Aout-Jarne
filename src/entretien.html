    <section class="Entretien section__btnRetour">
        <button onclick="window.location.href='accueil.html'" class="btnRetour" style="margin-bottom: 46px;">←&nbsp;Retour&nbsp;vers&nbsp;Accueil</button>
        <h1>Entretiens basiques</h1>
        <h2 class="Diagno__h2">Que peut-on faire soi-même sur le véhicule au niveau&nbsp;débutant&nbsp;?</h2>
        <div class="Entretien__container">
            <button class="Entretien__cart" data-value="laveGlace">
                <img src="laveGlaceEntretien.webp" alt="Sous le capot d'une VW Golf GTI" class="Entretien__img">
                <p class="fondEntretien"></p>
                <div class="Entretien__txtContainer">
                    <h3 class="Entretien__h3">Remplir le lave-glace</h3>
                    <p class="Entretien__p"><span>Vous voulez vérifier l'état de l'huile moteur ou remplir un autre liquide ?</span><span>C’est par ici !</span></p>
                </div>
            </button>
            <button class="Entretien__cart" data-value="changerBatterie">
                <img src="enleverBatterie.webp" alt="Un multimètre avec des fusibles et des relais" class="Entretien__img">
                <p class="fondEntretien"></p>
                <div class="Entretien__txtContainer">
                    <h3 class="Entretien__h3">Changer la batterie</h3>
                    <p class="Entretien__p"><span>Vous voulez remplacer la batterie, vérifier son état ou changer un fusible ?</span><span>C’est par ici !</span></p>
                </div>
            </button>
            <button class="Entretien__cart" data-value="etatPneus">
                <img src="entretienPneu.webp" alt="Les quatres types de pneus, été, hiver, quatres saisons, off-road" class="Entretien__img">
                <p class="fondEntretien"></p>
                <div class="Entretien__txtContainer">
                    <h3 class="Entretien__h3">Vérifier l'état des pneus</h3>
                    <p class="Entretien__p"><span>Vous voulez vérifier la pression de vos pneus ou vérifier son état ?</span><span>C’est par ici !</span></p>
                </div>
            </button>
            <button class="Entretien__cart" data-value="changerFusible">
                <img src="electrique_voiture.webp" alt="Disques de freins et plaquettes pour avant et derrière" class="Entretien__img">
                <p class="fondEntretien"></p>
                <div class="Entretien__txtContainer">
                    <h3 class="Entretien__h3">Changer un fusible</h3>
                    <p class="Entretien__p"><span>Vous voulez savoir si vos freins sont presque fin de vie ?</span><span>C’est par ici !</span></p>
                </div>
            </button>
            <button class="Entretien__cart" data-value="lavezVoiture">
                <img src="entretienCarros.webp" alt="Une image montrant une voiture rouge sur la quelle il y a des griffes." class="Entretien__img">
                <p class="fondEntretien"></p>
                <div class="Entretien__txtContainer">
                    <h3 class="Entretien__h3">Lavez sa voiture</h3>
                    <p class="Entretien__p"><span>Vous voulez remettre à neuf la peinture de votre voiture ?</span><span>C’est par ici !</span></p>
                </div>
            </button>
        </div>
