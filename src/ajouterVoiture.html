  <button onclick="window.location.href = 'mesVoitures.html'">← Mon garage</button>
  <section class="sectionButton">  
    <h1>Ajouter une nouvelle voiture :</h1>
    <form id="formAjouterVoiture">
        <div class="form__elements">
            <label for="marque">Marque de la voiture:*</label>
            <input type="text" name="marque" id="marque" required placeholder="Marque">
        </div>
        <div class="form__elements">
            <label for="modele">Modèle de la voiture:</label>
            <input type="text" name="modele" id="modele" placeholder="Modèle">
        </div>
        <div class="form__elements">
            <label for="type">Type de la voiture:*</label>
            <select name="type" id="type" required>
                <option value="">Sélectionner un type</option>
                <option value="Essence">Essence</option>
                <option value="Diesel">Diesel</option>
                <option value="MHEV">MHEV</option>
                <option value="HEV">HEV</option>
                <option value="PHEV">PHEV</option>
                <option value="Electrique">Électrique</option>
            </select>
        </div>
        <div class="form__elements inputKm">
            <label for="kms">Kilomètres parcourues</label>
            <input type="number" name="kms" id="kms" min="0" placeholder="Kilomètres">
        </div>
        <div class="form__elements">
            <label for="annee">Année de construction</label>
            <div class="inputAnnee">
                <input type="number" name="mois" id="mois" min="1" max="12" placeholder="Mois">
                <input type="number" name="annee" id="annee" min="1875" placeholder="Année"> <!-- Car :  Le break à vapeur Grenville (1875) roule toujours (Angleterre)-->
            </div>
        </div>
        <button type="submit" class="buttonAjouter">Ajouter la voiture</button>
    </form>
  </section>
