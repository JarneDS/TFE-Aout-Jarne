<body>
    <nav class="nav">
    <div class="navBar__alwaysDisplay">
      <img src="/logo.png" alt="logo de Les secrets de la voiture" class="menu__logo">

    <div class="menu__allLinks">

        <a href="accueil.html" class="menu__element">

        <a href="diagnostiques.html" class="menu__element">
          <img src="/diagnostiquesIcone.png" alt="icone Diagnostiques" class="menu__img">
          <h4 class="menu__title">Diagnostiques</h4>

        <a href="entretien.html" class="menu__element">

    <section>
        <h1>Mon compte</h1>
        <div class="div--flex">
            <div class="creerCompte">
                <div class="compteInfos">
                    <div class="image__profil" id="imageProfilContainer">
                        <img id="previewImage" src="" alt="Photo de profil" class="imageProfil">

                        <div class="bgImage"></div>

                        <img src="/imageProfil_modif.png" 
                            alt="Un crayon pour modifier la photo du profil" 
                            class="modifierImage">
                        
                        <input type="file" id="image" name="image" accept="image/*" hidden>
                    </div>
                    <h3 id="userName"></h3>
                </div>

                <form id="creerCompteForm" enctype="multipart/form-data">
                    <div>
                        <div class="form__elements">
                            <label for="nom">Nom</label>
                            <input type="text" name="nom" id="nom" required>
                        </div>

                        <div class="form__elements">
                            <label for="prenom">Prénom</label>
                            <input type="text" name="prenom" id="prenom" required>
                        </div>
                    </div>

                    <div class="form__elements">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="form__elements">
                        <label for="mdp">Mot de passe</label>
                        <input type="password" name="mdp" id="mdp" required>
                    </div>

                    <button type="submit">Créer mon compte</button>
                </form>
            </div>
        </div>
    </section>
</body>

</html>
